services:
  - type: web
    name: quantumlearn-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SIMULATION_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_CONCURRENT_SIMULATIONS
        value: "2"
      - key: LOG_LEVEL
        value: "INFO"
